# PALIMPSEST bridge test gate.
#
# Lives here rather than in a root pyproject.toml on purpose: `eval/` is a
# separate uv project with its own pyproject, and a root project file would
# change how uv resolves that lane. This ini scopes pytest to the bridge only.
#
#   .venv/bin/python -m pytest app/bridge/tests -q
#
# The suite talks to the LIVE FalkorDB container on the port in memory/config.py
# and isolates itself on the `palimpsest_test` graph key (GRAPH.DELETE teardown).
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
