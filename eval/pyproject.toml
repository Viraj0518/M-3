[project]
name = "lme-harness"
version = "0.1.0"
description = "PALIMPSEST x LongMemEval benchmark harness (GOAL.md victory condition 5)"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "tqdm>=4.66",
    "openai>=1.40",
    "anthropic>=0.34",
    "pyyaml>=6.0",
]

[project.scripts]
eval = "lme.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
