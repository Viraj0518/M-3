<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">MnemOS Synthesis Agent</title>
  <desc id="desc">A Guild synthesis agent ranks supplied evidence and produces a cited answer.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17152b"/><stop offset="1" stop-color="#34305c"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter></defs>
  <rect width="760" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="82" cy="78" r="30" fill="#ffcf70"/><path d="M68 82h28M72 70h20M76 94h12" stroke="#17152b" stroke-width="6" stroke-linecap="round"/>
  <text x="132" y="76" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Guild Synthesis Agent</text><text x="132" y="105" fill="#c8c4df" font-family="Arial, sans-serif" font-size="16">Question + evidence → cited answer</text>
  <g filter="url(#shadow)"><rect x="58" y="160" width="190" height="126" rx="18" fill="#fff"/><text x="82" y="195" fill="#17152b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Question</text><text x="82" y="225" fill="#5c5875" font-family="Arial, sans-serif" font-size="15">user intent</text><text x="82" y="249" fill="#5c5875" font-family="Arial, sans-serif" font-size="15">time constraints</text><rect x="286" y="160" width="190" height="126" rx="18" fill="#ffcf70"/><text x="310" y="195" fill="#17152b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Guild LLM Agent</text><text x="310" y="225" fill="#443719" font-family="Arial, sans-serif" font-size="15">rank evidence</text><text x="310" y="249" fill="#443719" font-family="Arial, sans-serif" font-size="15">detect conflicts</text><rect x="514" y="160" width="190" height="126" rx="18" fill="#fff"/><text x="538" y="195" fill="#17152b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Answer packet</text><text x="538" y="225" fill="#5c5875" font-family="Arial, sans-serif" font-size="15">answer + citations</text><text x="538" y="249" fill="#5c5875" font-family="Arial, sans-serif" font-size="15">confidence + review flag</text></g>
  <path d="M250 223h30M478 223h30" stroke="#ffcf70" stroke-width="5" stroke-linecap="round"/><path d="m270 213 14 10-14 10M498 213l14 10-14 10" fill="none" stroke="#ffcf70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="350" fill="#c8c4df" font-family="Arial, sans-serif" font-size="15">Guild mode: one-shot • evidence-grounded • abstains when weak</text>
</svg>
