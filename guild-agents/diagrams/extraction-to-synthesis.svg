<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Guild extraction to synthesis handoff</title>
  <desc id="desc">Two Guild agents connected by a memory packet.</desc>
  <rect width="980" height="360" rx="28" fill="#f4f7fb"/><text x="54" y="66" fill="#172b4d" font-family="Arial, sans-serif" font-size="27" font-weight="700">MnemOS Guild prototype</text><text x="54" y="96" fill="#52606d" font-family="Arial, sans-serif" font-size="16">The first visual experiment: extraction feeds synthesis.</text>
  <rect x="54" y="143" width="245" height="132" rx="20" fill="#172b4d"/><text x="82" y="184" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Extraction Agent</text><text x="82" y="216" fill="#b8c7da" font-family="Arial, sans-serif" font-size="15">conversation</text><text x="82" y="241" fill="#65d9a6" font-family="Arial, sans-serif" font-size="15">→ claims + evidence</text>
  <rect x="369" y="143" width="245" height="132" rx="20" fill="#65d9a6"/><text x="397" y="184" fill="#102a24" font-family="Arial, sans-serif" font-size="19" font-weight="700">Memory Packet</text><text x="397" y="216" fill="#21483d" font-family="Arial, sans-serif" font-size="15">atomic claims</text><text x="397" y="241" fill="#21483d" font-family="Arial, sans-serif" font-size="15">timestamps + provenance</text>
  <rect x="684" y="143" width="245" height="132" rx="20" fill="#453d76"/><text x="712" y="184" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Synthesis Agent</text><text x="712" y="216" fill="#d8d2f2" font-family="Arial, sans-serif" font-size="15">question + evidence</text><text x="712" y="241" fill="#ffcf70" font-family="Arial, sans-serif" font-size="15">→ answer + review flag</text>
  <path d="M299 209h58M614 209h58" stroke="#172b4d" stroke-width="5" stroke-linecap="round"/><path d="m341 199 14 10-14 10M656 199l14 10-14 10" fill="none" stroke="#172b4d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
