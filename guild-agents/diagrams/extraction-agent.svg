<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">MnemOS Extraction Agent</title>
  <desc id="desc">A Guild extraction agent converts a conversation into structured memory claims.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101828"/><stop offset="1" stop-color="#243b53"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter></defs>
  <rect width="760" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="82" cy="78" r="30" fill="#65d9a6"/><path d="M66 78h32M82 62v32" stroke="#101828" stroke-width="7" stroke-linecap="round"/>
  <text x="132" y="76" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Guild Extraction Agent</text><text x="132" y="105" fill="#b7c4d6" font-family="Arial, sans-serif" font-size="16">Conversation → durable memory candidates</text>
  <g filter="url(#shadow)"><rect x="58" y="160" width="190" height="126" rx="18" fill="#fff"/><text x="82" y="195" fill="#101828" font-family="Arial, sans-serif" font-size="17" font-weight="700">Conversation</text><text x="82" y="225" fill="#52606d" font-family="Arial, sans-serif" font-size="15">turns, timestamps,</text><text x="82" y="249" fill="#52606d" font-family="Arial, sans-serif" font-size="15">speaker metadata</text><rect x="286" y="160" width="190" height="126" rx="18" fill="#65d9a6"/><text x="310" y="195" fill="#101828" font-family="Arial, sans-serif" font-size="17" font-weight="700">Guild LLM Agent</text><text x="310" y="225" fill="#19342d" font-family="Arial, sans-serif" font-size="15">atomic claims</text><text x="310" y="249" fill="#19342d" font-family="Arial, sans-serif" font-size="15">confidence + evidence</text><rect x="514" y="160" width="190" height="126" rx="18" fill="#fff"/><text x="538" y="195" fill="#101828" font-family="Arial, sans-serif" font-size="17" font-weight="700">Memory packet</text><text x="538" y="225" fill="#52606d" font-family="Arial, sans-serif" font-size="15">facts, preferences,</text><text x="538" y="249" fill="#52606d" font-family="Arial, sans-serif" font-size="15">events, corrections</text></g>
  <path d="M250 223h30M478 223h30" stroke="#65d9a6" stroke-width="5" stroke-linecap="round"/><path d="m270 213 14 10-14 10M498 213l14 10-14 10" fill="none" stroke="#65d9a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="350" fill="#b7c4d6" font-family="Arial, sans-serif" font-size="15">Guild mode: one-shot • no credentials • JSON-only output</text>
</svg>
